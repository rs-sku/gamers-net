<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="http://localhost:8080/">
    <title>GamersNet - User profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/forms.css">
    <link rel="stylesheet" href="css/components/notification.css">
    <link rel="stylesheet" href="css/pages/profile.css">
</head>
<body style="display: none">
    <div class="container">
        <button id="logout-btn" class="btn logout-btn">Log out</button>
        <h1>Your profile</h1>
        <p id="profile-nickname" class="profile-nickname"></p>
        <div class="content-container">
            <nav class="profile-navigation" aria-label="Profile sections">
                <button id="show-friends-btn" class="btn btn-primary" aria-pressed="false">My friends <span id="friends-count">(0)</span><span id="incoming-nav-count"></span></button>
                <button id="show-users-btn" class="btn btn-primary" aria-pressed="false">Show all users</button>
                <button id="show-games-btn" class="btn btn-primary" aria-pressed="false">Show my games</button>
                <button id="add-game-btn" class="btn btn-primary" aria-pressed="false">Add game</button>
            </nav>
            <p id="friendship-status" class="list-message" role="status"></p>
            <div id="friendship-error" class="error-message" role="alert"></div>

            <section id="friends-container" class="data-container" aria-label="Friends and requests">
                <div class="section-heading">
                    <h2>My friends</h2>
                    <button id="refresh-friends-btn" class="btn btn-secondary">Refresh</button>
                </div>
                <form id="friend-request-form" class="friend-request-form">
                    <label for="friend-nickname">Add a friend by nickname</label>
                    <div class="friend-form-controls">
                        <input id="friend-nickname" class="friend-input" type="text" name="nickname" maxlength="50" required autocomplete="off" placeholder="Enter exact nickname">
                        <button id="send-friend-request-btn" class="btn btn-primary" type="submit">Send request</button>
                    </div>
                </form>
                <ul id="friends-list" class="data-list"></ul>
                <h2>Incoming requests <span id="incoming-count">(0)</span></h2>
                <ul id="incoming-requests-list" class="data-list"></ul>
                <h2>Outgoing requests <span id="outgoing-count">(0)</span></h2>
                <ul id="outgoing-requests-list" class="data-list"></ul>
            </section>
            
            <div id="game-form" class="game-form">
                <select id="game-name" class="game-input">
                    <option value="">Select a game</option>
                </select>
                <button id="submit-game-btn" class="btn btn-primary">Add</button>
                <div id="game-error" class="error-message"></div>
            </div>
            
            <div id="users-container" class="data-container">
                <h2>All users</h2>
                <label for="user-search">Search by nickname</label>
                <input id="user-search" class="friend-input user-search" type="search" placeholder="Find a player" autocomplete="off">
                <ul id="users-list" class="data-list"></ul>
            </div>
            
            <div id="games-container" class="data-container">
                <h2>My games</h2>
                <ul id="games-list" class="data-list"></ul>
            </div>
        </div>
    </div>
    <div class="notification" id="notification" role="status"></div>

    <script type="module" src="js/api/auth.js"></script>
    <script type="module" src="js/api/games.js"></script>
    <script type="module" src="js/components/notification.js"></script>
    <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
